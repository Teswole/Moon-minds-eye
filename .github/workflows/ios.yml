# 2026-11-15 2:10 PM CST — Build the iPhone app on GitHub's Macs; send it to TestFlight once the Apple secrets are added
name: iPhone app

on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml', 'index.html', 'moon-albedo.png', 'moon-normal.png']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      HAS_APPLE_SECRETS: ${{ secrets.ASC_KEY_P8 != '' && secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode on the machine
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Make the Xcode project
        run: |
          mkdir -p ios/Web && cp index.html moon-albedo.png moon-normal.png ios/Web/
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Compile check (no signing)
        run: |
          cd ios
          set -o pipefail
          xcodebuild -project MoonMindsEye.xcodeproj -scheme MoonMindsEye \
            -destination 'generic/platform=iOS' -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO build 2>&1 | grep -E "error:|warning: |BUILD (SUCCEEDED|FAILED)|SwiftCompile" | grep -v "^$" | tail -40
          APP="$RUNNER_TEMP/dd/Build/Products/Release-iphoneos/MoonMindsEye.app"
          test -f "$APP/MoonMindsEye" && echo "App built: $(du -sh "$APP" | cut -f1)" || (echo "App binary missing" && exit 1)

      - name: Archive and send to TestFlight
        if: env.HAS_APPLE_SECRETS == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # trim stray spaces or line breaks from pasted IDs, then check their shape (lengths only, never the values)
          ASC_KEY_ID=$(printf '%s' "$ASC_KEY_ID" | tr -cd 'A-Za-z0-9'); ASC_ISSUER_ID=$(printf '%s' "$ASC_ISSUER_ID" | tr -cd 'a-fA-F0-9-'); APPLE_TEAM_ID=$(printf '%s' "$APPLE_TEAM_ID" | tr -cd 'A-Za-z0-9')
          H=$(printf '%s' "$ASC_ISSUER_ID" | tr -cd 'a-fA-F0-9'); [ ${#H} -eq 32 ] && ASC_ISSUER_ID="${H:0:8}-${H:8:4}-${H:12:4}-${H:16:4}-${H:20:12}"   # put back dashes the phone dropped
          APPLE_TEAM_ID=XXLMLJM5P5   # Team ID from the Apple Developer page (not a password; it is part of the app's ID)
          echo "Key ID: ${#ASC_KEY_ID} characters (should be 10) | Issuer ID: ${#ASC_ISSUER_ID} characters (should be 36) | Team ID: ${#APPLE_TEAM_ID} characters (should be 10)"
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          # Rebuild the key cleanly: phone copy-paste can merge lines or turn the dashes into long dashes
          BODY=$(printf '%s' "$ASC_KEY_P8" | tr -d '\r' | sed -E 's/[—–‒]+/-----/g; s/-+ *(BEGIN|END) [A-Z ]*KEY *-+//g' | tr -cd 'A-Za-z0-9+/=')
          { echo "-----BEGIN PRIVATE KEY-----"; echo "$BODY" | fold -w 64; echo "-----END PRIVATE KEY-----"; } > "$KEY"
          echo "Key text: ${#BODY} characters (a normal Apple key is about 200)"
          openssl pkey -in "$KEY" -noout && echo "Key reads OK" || { echo "The ASC_KEY_P8 secret isn't a complete Apple key. Paste the whole .p8 file text again."; exit 1; }
          cd ios
          xcodebuild archive -project MoonMindsEye.xcodeproj -scheme MoonMindsEye \
            -destination 'generic/platform=iOS' -configuration Release \
            -archivePath "$RUNNER_TEMP/MoonMindsEye.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic CODE_SIGN_IDENTITY="Apple Distribution" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" -quiet
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" ExportOptions.plist
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/MoonMindsEye.xcarchive" \
            -exportOptionsPlist ExportOptions.plist -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          rm -f "$KEY"

      - name: No Apple secrets yet
        if: env.HAS_APPLE_SECRETS != 'true'
        run: echo "Compile check passed. Add the four Apple secrets to send builds to TestFlight."
