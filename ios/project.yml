# 2026-11-15 1:40 PM CST — Xcode project definition (XcodeGen builds the .xcodeproj on GitHub's Macs)
name: MoonMindsEye
options:
  bundleIdPrefix: com.teswole
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  MoonMindsEye:
    type: application
    platform: iOS
    sources:
      - path: MoonMindsEye
      - path: Web            # the photo processor + moon maps, copied from the website at build time
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.teswole.moonmindseye
        PRODUCT_NAME: MoonMindsEye
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    info:
      path: MoonMindsEye/Info.plist
      properties:
        CFBundleDisplayName: "Moon Mind's Eye"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Moon Mind's Eye uses the camera to photograph the moon."
        NSLocationWhenInUseUsageDescription: "Your location tells the app where the moon is in your sky."
        NSPhotoLibraryAddUsageDescription: "Saves your mind's-eye moon photos to your Photos library."
